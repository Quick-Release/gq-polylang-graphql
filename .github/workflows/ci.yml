name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer analyse -- --error-format=github

  integration:
    name: Integration (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Include-only: these are compatible stacks, not a Cartesian product.
        include:
          - stack: minimum
            wordpress: "6.5"
            php: "7.4"
            wpgraphql: "2.0.0"
            polylang: "3.7"
          - stack: current
            wordpress: "7.1.2"
            php: "8.4"
            wpgraphql: "2.23.1"
            polylang: "3.8.10"
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify disposable setup guards
        run: tests/integration/check-setup-safety.sh
      - name: Integration tests against WordPress, WPGraphQL and Polylang
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          PHP_VERSION: ${{ matrix.php }}
          WPGRAPHQL_VERSION: ${{ matrix.wpgraphql }}
          POLYLANG_VERSION: ${{ matrix.polylang }}
        run: tests/integration/run.sh
